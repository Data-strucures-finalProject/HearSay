networks: 
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
  
services:

  mongodb:
    image: mongo:latest # Or specify a version like mongo:6.0
    container_name: hearsay_mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./db/data:/data/db # Persist data in a named volume
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    restart: unless-stopped # Restart policy
    networks:
      app-network:
        ipv4_address: 172.19.0.101
  
  backend:
    build: 
      context: ./hearsay
      dockerfile: dockerfile.backend
    container_name: hearsay_backend
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SCHEMA_DIR: /app/db-schemas
      TRUST_PROXY: 172.19.0.102
      CLOUDFLARE_TUNNEL_TOKEN: ""
      INITIAL_ADMIN_EMAIL: ""
      INITIAL_ADMIN_PASSWORD: ""
    env_file:
      - ./.env
    volumes:
      - ./db/schemas:/app/db-schemas:ro
    restart: unless-stopped # Restart policy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      app-network:
        ipv4_address: 172.19.0.103
    depends_on:
      - mongodb
  
  frontend:
    build: 
      context: ./hearsay
      dockerfile: dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI}
    container_name: hearsay_frontend
    ports:
      - "127.0.0.1:8080:80"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_BASE: /api
    restart: unless-stopped # Restart policy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://backend:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      app-network:
        ipv4_address: 172.19.0.102
    depends_on:
      - backend

  nginx-rev-proxy:
    container_name: hearsay_reverseproxy
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:81"
    environment:
      TZ: "America/Toronto"
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - ./nginxrevproxy/data:/data
      - ./nginxrevproxy/letsencrypt:/etc/letsencrypt   
    networks:
      app-network:
        ipv4_address: 172.19.0.104

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - nginx-rev-proxy
    networks:
      app-network:
        ipv4_address: 172.19.0.105
