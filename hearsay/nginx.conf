# Honor the HTTPS scheme only from Nginx Proxy Manager on the Compose network.
map "$realip_remote_addr:$http_x_forwarded_proto" $hearsay_forwarded_proto {
  default $scheme;
  "172.19.0.104:https" https;
}

server {
  listen 80;
  set_real_ip_from 172.19.0.104;
  real_ip_header X-Real-IP;
  resolver 127.0.0.11 ipv6=off;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always fetch the current app entry point so old OAuth build settings expire.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location /api {
    proxy_pass http://backend:5174;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $hearsay_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
